<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote test client</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 12px; background: #111; color: #eee; }
  video { width: 100%; max-height: 70vh; background: #000; }
  textarea { width: 100%; height: 64px; box-sizing: border-box; background: #1c1c1c; color: #ddd; border: 1px solid #444; }
  button { padding: 10px 18px; font-size: 16px; margin: 8px 0; }
  #st { margin-left: 10px; color: #8cf; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline controls></video>
<p>1) Запусти host.exe, 2) вставь код (Ctrl+V) в поле ниже, 3) нажми «Подключить».</p>
<textarea id="offer" placeholder="RDOFFER:..."></textarea>
<div><button id="go">Подключить</button><span id="st"></span></div>
<textarea id="answer" readonly placeholder="Здесь появится ответ RDANS:... (он копируется сам)"></textarea>
<script>
const $ = id => document.getElementById(id);
const st = t => { $('st').textContent = t; };

$('go').onclick = async () => {
  try {
    const raw = $('offer').value.trim();
    if (!raw.startsWith('RDOFFER:')) { st('нужен код, который начинается с RDOFFER:'); return; }
    const sdp = atob(raw.slice(8));

    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    pc.ontrack = e => {
      $('v').srcObject = e.streams[0] || new MediaStream([e.track]);
      try { e.receiver.jitterBufferTarget = 0; } catch (_) {}   // минимальная задержка
      $('v').play().catch(() => {});
    };
    pc.onconnectionstatechange = () => st('соединение: ' + pc.connectionState);

    await pc.setRemoteDescription({ type: 'offer', sdp });
    await pc.setLocalDescription(await pc.createAnswer());

    // Ждём сбора ICE-кандидатов (максимум 4 сек), чтобы ответ был полным.
    await new Promise(res => {
      if (pc.iceGatheringState === 'complete') return res();
      pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') res(); };
      setTimeout(res, 4000);
    });

    const out = 'RDANS:' + btoa(pc.localDescription.sdp);
    $('answer').value = out;
    try {
      await navigator.clipboard.writeText(out);
      st('ответ скопирован, хост его подхватит');
    } catch (_) {
      $('answer').select();
      st('скопируй ответ вручную (Ctrl+C)');
    }
  } catch (e) {
    st('ошибка: ' + e);
  }
};
</script>
</body>
</html>
